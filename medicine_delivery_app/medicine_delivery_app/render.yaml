# Render.com blueprint for the backend. A persistent disk is needed so the database survives restarts
# (disks are on paid plans).
services:
  - type: web
    name: doorstep-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DOORSTEP_ENV
        value: production
      - key: DOORSTEP_DB
        value: /data/doorstep.db
      - key: DOORSTEP_ADMIN_PIN
        sync: false          # you type this in the Render dashboard
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
